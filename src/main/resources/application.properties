spring.application.name=BiblioRed
server.address=127.0.0.1
server.port=${PORT:8080}

# MySQL se prepara una sola vez importando database/mysql.sql.
# Contraseña local: copiar application-local.properties.example a
# application-local.properties en la carpeta que contiene pom.xml.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bibliored?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.open-in-view=false

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false
server.error.include-message=never
server.error.include-stacktrace=never
spring.jackson.serialization.fail-on-empty-beans=false
